<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>dopamine</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/hub.js"></script>
  </head>
  <body>
    <main class="hub">
      <header>
        <h1><img id="logo" class="logo" src="/favicon.svg" alt="dopamine" />Your dashboards</h1>
        <span id="count" class="muted"></span>
      </header>
      <nav id="filters" class="filters" aria-label="Filter dashboards" hidden></nav>
      <p id="error" role="status" hidden></p>
      <p id="peer" class="notice" hidden></p>
      <section id="needs" hidden>
        <h2>Needs you <span id="needs-count" class="pill"></span></h2>
        <div id="questions" class="stack"></div>
      </section>
      <section>
        <h2>All dashboards</h2>
        <div id="dashboards" class="list" hidden></div>
        <p id="unmatched" class="muted" hidden>
          No dashboards match these filters. <button id="clear" type="button">Show all</button>
        </p>
        <p id="empty" class="muted" hidden>
          No dashboards yet. They appear here when an agent thread publishes one.
        </p>
      </section>
    </main>
  </body>
</html>
