<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>dopamine</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/shell.js"></script>
  </head>
  <body class="shell">
    <nav class="strip">
      <a href="/" aria-label="All dashboards">← Dashboards</a><strong id="title"></strong
      ><span id="status" class="muted"></span><a id="owner-thread" hidden>Owner thread</a
      ><a id="open-thread" hidden>Open thread</a><a id="direct">Open directly ↗</a>
    </nav>
    <p id="error" role="status" hidden></p>
    <p id="blocked" hidden>
      This dashboard's site doesn't allow it to be shown here. <a id="outside">Open directly ↗</a>
    </p>
    <iframe
      id="dashboard"
      title="Dashboard"
      sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox"
      allow="clipboard-write"
      hidden
    ></iframe>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Confirm this action</h2>
      <p class="muted">
        Dopamine drew this box from the request it recorded. The dashboard can't see or press it.
      </p>
      <dl id="confirm-fields"></dl>
      <p id="confirm-error" role="alert" hidden></p>
      <div class="confirm-buttons">
        <button id="confirm-cancel" type="button" autofocus>Cancel</button>
        <button id="confirm-ok" type="button" disabled>Confirm</button>
      </div>
    </dialog>
  </body>
</html>
